services:
  postgres:
    profiles: ["local-db"]
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: katerina
      POSTGRES_USER: katerina
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Set LOCAL_DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katerina -d katerina"]
      interval: 5s
      retries: 10
volumes:
  database:
